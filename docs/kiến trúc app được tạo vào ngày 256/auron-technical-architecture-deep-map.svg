<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1480" viewBox="0 0 1900 1480" role="img" aria-labelledby="title desc">
  <title id="title">AURON Technical Architecture Deep Map</title>
  <desc id="desc">Deep technical architecture for AURON showing entry points, navigation, screens, ViewModels, repositories, Room database, domain engines, tests, and future integration boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42515f"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #14212b; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #52616f; }
      .group { fill: #ffffff; stroke: #c5cbd3; stroke-width: 1.2; rx: 18; }
      .groupTitle { font: 700 16px Arial, sans-serif; fill: #14212b; }
      .ui { fill: #f8fbff; stroke: #52616f; stroke-width: 1.3; rx: 12; }
      .state { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.3; rx: 12; }
      .domain { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.3; rx: 12; }
      .data { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.3; rx: 12; }
      .store { fill: #ecfeff; stroke: #0e7490; stroke-width: 1.3; rx: 12; }
      .test { fill: #ecfdf5; stroke: #059669; stroke-width: 1.3; rx: 12; }
      .future { fill: #ffffff; stroke: #7b8794; stroke-width: 1.3; stroke-dasharray: 8 6; rx: 12; }
      .label { font: 700 13px Arial, sans-serif; fill: #14212b; text-anchor: middle; }
      .small { font: 400 11px Arial, sans-serif; fill: #52616f; text-anchor: middle; }
      .edge { stroke: #42515f; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .edgeFuture { stroke: #6b7280; stroke-width: 1.4; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1900" height="1480"/>
  <text class="title" x="40" y="48">AURON Technical Architecture Deep Map</text>
  <text class="subtitle" x="40" y="73">Entry, routes, Compose surfaces, ViewModels, domain engines, data/storage, tests, and future integration boundaries.</text>

