  <path class="edge" d="M790 653 L890 482"/>
  <path class="edge" d="M1005 346 L1005 430"/>
  <path class="edge" d="M1005 660 L1005 534"/>
  <path class="edge" d="M1005 660 L790 653"/>
  <path class="edge" d="M1005 660 L790 130"/>
  <path class="edge" d="M1005 660 L890 298"/>
  <path class="edge" d="M300 766 L210 473"/>
  <path class="edge" d="M500 766 L580 523"/>
  <path class="edge" d="M500 766 L300 456"/>
  <path class="edgeFuture" d="M1120 708 L1250 235"/>
  <path class="edgeFuture" d="M1120 482 L1250 345"/>
  <path class="edgeFuture" d="M1120 708 L1250 455"/>
  <path class="edgeFuture" d="M500 176 L1250 565"/>
  <path class="edgeFuture" d="M500 176 L1250 675"/>
</svg>
